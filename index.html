let cart=[];const itemsById={};
function showToast(text){const t=document.getElementById("toast");t.textContent="✅ "+text;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}
function init(){const nav=document.getElementById("category-nav"),container=document.getElementById("menu-container");storeData.menu.forEach((cat,idx)=>{const btn=document.createElement("button");btn.textContent=cat.category_name;if(idx===0)btn.classList.add("active");btn.onclick=()=>{document.querySelectorAll(".nav-categories button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");document.getElementById(cat.category_id).scrollIntoView({behavior:"smooth"})};nav.appendChild(btn);const section=document.createElement("section");section.className="category-section";section.id=cat.category_id;const title=document.createElement("h2");title.className="category-title";title.textContent=cat.category_name;section.appendChild(title);const grid=document.createElement("div");grid.className="items-grid";cat.items.forEach(item=>{itemsById[item.id]=item;const hasPrice=item.price_usd!==null&&item.price_usd!==undefined;const card=document.createElement("article");card.className="item-card";card.innerHTML=`<div class="img-wrapper"><img src="${item.img}" alt="${item.name}" loading="lazy">${item.badge?`<span class="tag-badge ${item.top?'top':''}">${item.badge}</span>`:""}</div><div class="item-body"><div><h3>${item.name}</h3><p>${item.description||""}</p></div><div class="item-footer"><span class="price">${hasPrice?'$'+item.price_usd.toFixed(2):"Consultar"}</span><button class="btn-add" ${!hasPrice?"disabled":""} onclick="addToCart('${item.id}')">${hasPrice?"+ Agregar":"Consultar"}</button></div></div>`;grid.appendChild(card)});section.appendChild(grid);container.appendChild(section)});const pay=document.getElementById("payment-method");storeData.config.payment_methods.forEach(m=>pay.add(new Option(m,m)));const salsas=document.getElementById("salsas-container");storeData.config.salsas_disponibles.forEach(s=>{const label=document.createElement("label");label.innerHTML=`<input type="checkbox" value="${s}" class="salsa-chk"> ${s}`;salsas.appendChild(label)})}
function addToCart(id){const item=itemsById[id];if(!item)return;const existing=cart.find(i=>i.id===id);existing?existing.qty++:cart.push({...item,qty:1});updateCartBar();showToast(`${item.name} agregado`)}
function changeQty(id,delta){const i=cart.findIndex(i=>i.id===id);if(i>-1){cart[i].qty+=delta;if(cart[i].qty<=0)cart.splice(i,1)}renderCart();updateCartBar()}
function updateCartBar(){const count=cart.reduce((a,i)=>a+i.qty,0),subtotal=cart.reduce((a,i)=>a+i.price_usd*i.qty,0);document.getElementById("cart-count").textContent=count;document.getElementById("cart-bar-total").textContent=subtotal.toFixed(2)}
function openCart(){document.getElementById("cart-modal").style.display="block";renderCart()}function closeCart(){document.getElementById("cart-modal").style.display="none"}
function renderCart(){const list=document.getElementById("cart-items-list");list.innerHTML="";if(!cart.length)list.innerHTML="<p style='color:#999;text-align:center;padding:15px 0;'>Tu carrito está vacío.</p>";else cart.forEach(item=>{const row=document.createElement("div");row.className="cart-item";row.innerHTML=`<div><strong>${item.name}</strong><br><small style="color:#BBB">$${item.price_usd.toFixed(2)} c/u</small></div><div class="qty-controls"><button onclick="changeQty('${item.id}',-1)">-</button><span style="min-width:20px;text-align:center;font-weight:bold">${item.qty}</span><button onclick="changeQty('${item.id}',1)">+</button></div>`;list.appendChild(row)});const subtotal=cart.reduce((a,i)=>a+i.price_usd*i.qty,0),delivery=document.getElementById("delivery-type").value=== "delivery"?storeData.config.delivery.fee_usd:0,total=subtotal+delivery;document.getElementById("subtotal-amount").textContent=subtotal.toFixed(2);document.getElementById("delivery-amount").textContent=delivery.toFixed(2);document.getElementById("total-amount").textContent=total.toFixed(2)}
function sendWhatsApp(){if(!cart.length)return alert("Agrega al menos un producto al pedido.");const salsas=[...document.querySelectorAll(".salsa-chk:checked")].map(c=>c.value),delivery=document.getElementById("delivery-type").value=== "delivery"?"Delivery (+$6.00)":"Retiro en local",payment=document.getElementById("payment-method").value,notes=document.getElementById("customer-notes").value.trim(),total=document.getElementById("total-amount").textContent;let msg=`*NUEVO PEDIDO - ${storeData.store.toUpperCase()}*\n\n`;cart.forEach(i=>msg+=`• ${i.qty}x ${i.name} ($${(i.price_usd*i.qty).toFixed(2)})\n`);msg+=`\n*Salsas:* ${salsas.length?salsas.join(", "):"Ninguna"}\n*Entrega:* ${delivery}\n*Método de pago:* ${payment}`;if(notes)msg+=`\n*Datos/Dirección:* ${notes}`;msg+=`\n\n*TOTAL A PAGAR: $${total} USD*`;window.open(`https://wa.me/${storeData.contact.whatsapp}?text=${encodeURIComponent(msg)}`,"_blank")}
init();
</script>
</body>
</html>
